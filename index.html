<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>어스 맛집 대동여지도</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--us:#0E8A4C;--us-bg:#E4F5EA;--reg:#F25C1F;--blue:#1B4E8E;--ct:#1E7BE0;--ink:#20262B;--sub:#6E6A61;--paper:#FFFDF8;--line:#E7E0D2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}
header{padding:9px 13px 7px;background:var(--paper);border-bottom:1px solid var(--line);z-index:20}
.titlerow{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
h1{font-family:'Black Han Sans',sans-serif;font-size:1.18rem;letter-spacing:-.3px}
h1 em{font-style:normal;color:var(--us)}
.sub{font-size:.68rem;color:var(--sub)}
.searchbar{position:relative;margin-top:7px}
.searchbar input{width:100%;font:inherit;font-size:.86rem;padding:8px 32px 8px 30px;border-radius:10px;border:1.5px solid var(--line);background:#fff;outline:none}
.searchbar input:focus{border-color:var(--reg);box-shadow:0 0 0 3px rgba(242,92,31,.13)}
.searchbar .ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5;font-size:.82rem}
.searchbar .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:#EFE9DC;color:var(--sub);width:21px;height:21px;border-radius:50%;font-size:.72rem;cursor:pointer;display:none}
.searchbar .clr.on{display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding:7px 0 1px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.us{color:var(--us);border-color:#BFE3CD}.chip.us.on{background:var(--us);border-color:var(--us);color:#fff}
.chip.ctc{color:var(--ct);border-color:#BBD9F5}.chip.ctc.on{background:var(--ct);border-color:var(--ct);color:#fff}
#mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:#E9E5DC}
.count{position:absolute;top:9px;left:9px;z-index:5;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:4px 9px;font-size:.72rem;font-weight:700;color:var(--sub);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.count b{color:var(--us)}
.fab{position:absolute;right:11px;bottom:13px;z-index:5;border:none;border-radius:999px;background:var(--reg);color:#fff;font:inherit;font-weight:700;font-size:.88rem;padding:12px 17px;cursor:pointer;box-shadow:0 4px 14px rgba(201,69,18,.4)}
.loaderr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:30;background:var(--paper);color:var(--sub);font-size:.85rem;line-height:1.7}
.loaderr b{color:var(--ink)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:15;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:78%;overflow-y:auto;padding:13px 15px 20px;display:none}
.sheet.open{display:block;animation:up .18s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:4px;background:#DDD6C8;margin:0 auto 10px}
.s-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.s-name{font-weight:700;font-size:1.1rem}
.tag{font-size:.66rem;font-weight:800;border-radius:20px;padding:3px 8px;white-space:nowrap}
.tag.t-us{background:var(--us);color:#fff}.tag.t-cat{background:#F3EFE5;color:#6E6A61}
.tag.t-w2{background:#C43A2E;color:#fff}.tag.t-w1{background:#F2B705;color:#3A2E00}.tag.t-ct{background:var(--ct);color:#fff}
.s-stats{margin-top:5px;font-size:.8rem;color:var(--sub)}.s-stats b{color:var(--ink)}.star{color:#E8A100}
#rv{width:100%;height:190px;border-radius:12px;margin-top:11px;background:#EEE;display:none;overflow:hidden}
.rv-none{margin-top:9px;font-size:.76rem;color:var(--sub);background:#F4F1E8;border-radius:9px;padding:8px 11px;display:none}
.walkline{margin-top:9px;font-size:.77rem;color:var(--blue);font-weight:700}
.ctline{margin-top:7px;font-size:.75rem;color:var(--sub)}.ctline b{color:var(--ct)}
.planbox{margin-top:9px;background:#FFF4E5;border:1px dashed #E09B4C;border-radius:10px;padding:9px 11px;font-size:.79rem;line-height:1.55;color:#5C4A2E}.planbox b{color:#B4570E}
.usbox{margin-top:10px;background:var(--us-bg);border-left:4px solid var(--us);border-radius:0 10px 10px 0;padding:9px 11px}
.usbox .who{font-size:.69rem;font-weight:800;color:var(--us);letter-spacing:.05em;margin-bottom:3px}
.usbox p{font-size:.85rem;line-height:1.55;color:#1F3D2C;white-space:pre-line}
.gmemo{margin-top:8px;font-size:.82rem;line-height:1.5;color:#4A453D}
.s-links{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}
.s-links button{font:inherit;font-size:.8rem;font-weight:700;border-radius:9px;padding:9px 13px;border:1.5px solid transparent;cursor:pointer}
.kakao{background:#FEE500;color:#191600}.nvr{background:#03C75A;color:#fff}.ctlink{background:#3C2A6E;color:#fff}
.rvbtn{background:#fff;color:#191600;border-color:#FEE500!important}
.closebtn{background:#fff;border-color:var(--line)!important;color:var(--sub)}
footer{padding:5px 13px;font-size:.64rem;color:#B3AA9B;background:var(--paper);border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="titlerow"><h1>어스 <em>맛집</em> 대동여지도</h1><span class="sub">어스얼라이언스 반경 2km · <b style="color:var(--us)">초록=US인증</b> · <b style="color:var(--ct)">파랑테=예약가능</b></span></div>
  <div class="searchbar"><span class="ico">🔍</span><input id="q" type="search" placeholder="가게·메뉴·후기 검색 (소금빵, 짬뽕, 혼밥…)" autocomplete="off"><button class="clr" id="qclr">✕</button></div>
  <div class="chips" id="chips"></div>
</header>
<div id="mapwrap">
  <div id="map"></div>
  <div class="count" id="count"></div>
  <button class="fab" id="fab">🎲 아무거나</button>
  <div class="loaderr" id="loaderr"></div>
  <div class="sheet" id="sheet"></div>
</div>
<footer>구글맵 평점·좌표 2026-07 / US후기=사내 노션. 지도·로드뷰=카카오. 웨이팅은 당일 앱 확인 필수.</footer>
</div>

 "우동 카덴":"캐치테이블 <b>미입점</b>(공식 페이지에 '아직 입점하지 않은 매장', 알림 대기 3,140명). 합정점은 <b>테이블링도 원격 불가 — 현장 등록만</b>. 평일 11:45 등록 시 앞 17팀·35분 입장 사례 → 12시에 먹으려면 <b>11:20까지 도착</b>.",
 "정돈 홍대점":"캐치테이블 <b>입점 확정 — 예약까지 가능</b>. 웨이팅 맛집이지만 앱으로 미리 예약해두면 대기 없이 입장 가능. 12시 식사면 <b>전날~당일 오전에 예약</b>이 제일 확실하고, 예약 실패 시 원격 웨이팅으로 전환.",
 "크레이지카츠":"캐치테이블 <b>원격 줄서기 확정</b>. 등록 시간이 갈림 — <b>현장은 10:00부터, 캐치테이블 앱은 11:00부터</b> 열림(디너는 현장 16:30/앱 17:00). 11:50 등록해도 거의 바로 입장한 날 있는 반면 1시간 30분 걸린 날도 있으니 <b>11시 정각에 걸어두는 게 안전</b>. 앱에서 메뉴 선주문도 됨.",
 "오레노라멘 본점":"캐치테이블엔 <b>강남점만 입점</b>, 합정 본점은 미입점. <b>매장 밖 키오스크에서 선주문하면 그때부터 웨이팅</b> 시작이니 도착하자마자 키오스크부터. 회전 빠른 편(20분 내외 후기 다수)이지만 오픈런도 대기 있음.",
};
P.forEach(p=>{
  p.ct=CT_OK.includes(p.n)?1:CT_NONE.includes(p.n)?-1:0;
  p.ctUrl=p.ct===1?`https://app.catchtable.co.kr/ct/shop/${CT_SLUG[p.n]||''}`:null;
  p.ctSearch=`https://app.catchtable.co.kr/ct/search/total?keyword=${encodeURIComponent(p.n)}`;
  p.gold=p.us&&p.ct===1;
});
function hav(a,b){const R=6371000,d=Math.PI/180,dLat=(b.lat-a.lat)*d,dLng=(b.lng-a.lng)*d,
  h=Math.sin(dLat/2)**2+Math.cos(a.lat*d)*Math.cos(b.lat*d)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const t12=m=>{const t=12*60-m;return Math.floor(t/60)+":"+String(t%60).padStart(2,"0");};
function lunchPlan(p){const w=p.walk,leave=t12(w);
  if(WAIT_HOW[p.n])return WAIT_HOW[p.n]+` (도보 ${w}분 · <b>${leave} 출발</b>)`;
  if(p.wait===3)return `캐치테이블 원격 줄서기를 <b>오전 9:30~10:00</b>에. 미루기(2회)로 조정, <b>${leave} 출발</b>.`;
  if(p.ct===-1)return `캐치테이블 미입점 — <b>현장 등록만</b>. <b>11:20까지 도착</b> 권장.`;
  if(p.wait===2)return `<b>11:00~11:15 원격 줄서기</b>. 일찍 걸고 미루기로 조정. <b>${leave} 출발</b>.`;
  return `11:45 전 도착 또는 12:30 이후. 원격되면 <b>11:30</b>쯤 걸기.`;}

const IS_MOBILE=/android|iphone|ipad|ipod/i.test(navigator.userAgent);
let map,geocoderOK=true,rv,rvClient;

// ── 카카오 SDK 로드 대기 ──
function bootError(msg){
  const el=document.getElementById('loaderr');
  el.innerHTML=msg; el.style.display='flex';
}
function initKakao(){
  if(!window.kakao||!kakao.maps){return bootError(
    '<b>카카오 지도를 불러오지 못했어.</b><br>이 페이지가 <b>등록된 도메인</b>에서 열렸는지 확인해줘.<br>(로컬 파일·미리보기에선 안 뜸 — GitHub Pages 주소로 열어야 함)');}
  kakao.maps.load(()=>{ buildMap(); });
}
function buildMap(){
  map=new kakao.maps.Map(document.getElementById('map'),{
    center:new kakao.maps.LatLng(OFFICE.lat,OFFICE.lng), level:4 });
  map.setMaxLevel(7);
  rvClient=new kakao.maps.RoadviewClient();
  // 회사 마커 + 반경
  const office=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(OFFICE.lat,OFFICE.lng),
    content:'<div style="background:#1B4E8E;color:#fff;border:2px solid #fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.4)">🏢</div>',
    zIndex:9});
  office.setMap(map);
  [500,1000,2000].forEach(r=>new kakao.maps.Circle({center:new kakao.maps.LatLng(OFFICE.lat,OFFICE.lng),
    radius:r,strokeWeight:1,strokeColor:'#B6AC98',strokeOpacity:.7,strokeStyle:'dash',fillOpacity:0}).setMap(map));
  buildMarkers(); buildChips(); applyFilter();
  kakao.maps.event.addListener(map,'click',closeSheet);
}

// ── 마커 ──
const CATS=["전체","US인증","US+예약가능","한식","일식","중식","양식","아시안","인도·커리","고기","치킨·술집","샐러드·가볍게","카페·베이커리"];
let active="전체",q="",curLine=null;
P.forEach(p=>{
  p.dist=hav(OFFICE,p);
  p.walk=Math.max(1,Math.round(p.dist*1.35/67)); // 직선*1.35 추정, 실경로는 카카오맵 길찾기 버튼
});
function matchCat(p){
  const c=active==="전체"?true:active==="US인증"?!!p.us:active==="US+예약가능"?!!p.gold:p.cat===active;
  if(!c)return false; if(!q)return true;
  const hay=[p.n,p.cat,p.memo||"",p.usr||"",p.us?"US인증 어스":"",p.ct===1?"캐치테이블 예약 웨이팅":"",p.wait>=2?"웨이팅":""].join(" ").toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(t=>hay.includes(t));
}
function applyFilter(){
  let shown=0,us=0;
  P.forEach(p=>{ const ok=matchCat(p);
    if(ok){p._ov.setMap(map);shown++;if(p.us)us++;} else p._ov.setMap(null);
  });
  document.getElementById('count').innerHTML=q?`"${q}" ${shown}곳`:`${shown}곳 · <b>US ${us}</b>`;
  // 오버레이 DOM에 클릭 재바인딩
  setTimeout(bindOverlayClicks,50);
}
function bindOverlayClicks(){
  document.querySelectorAll('.pin').forEach(el=>{
    if(el._bound)return; el._bound=1;
    el.addEventListener('click',ev=>{ev.stopPropagation();
      const idx=el.getAttribute('data-i'); if(idx!=null)openSheet(P[+idx]);});
  });
}
function buildChips(){
  const wrap=document.getElementById('chips');
  CATS.forEach(c=>{const b=document.createElement('button');
    b.className='chip'+(c==='US인증'?' us':'')+(c==='US+예약가능'?' ctc':'')+(c==='전체'?' on':'');
    b.textContent=c==='US인증'?'🟢 US인증':c==='US+예약가능'?'🔵 US+예약가능':c;
    b.onclick=()=>{active=c;[...wrap.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');closeSheet();applyFilter();};
    wrap.appendChild(b);});
}
// 마커에 data-i 심기 위해 content 갱신
function buildMarkers(){
  P.forEach((p,i)=>{
    const size=p.us?30:22, col=p.gold?'#0E8A4C':p.us?'#0E8A4C':'#F25C1F';
    const ring=p.gold?'border:3px solid #1E7BE0;box-shadow:0 0 0 2px #fff,0 0 8px 2px rgba(30,123,224,.7);':'border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);';
    const el=document.createElement('div');
    el.className='pin'; el.setAttribute('data-i',i);
    el.style.cssText=`width:${size}px;height:${size}px;background:${col};${ring}border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;cursor:pointer`;
    el.innerHTML=`<span style="transform:rotate(45deg);color:#fff;font-weight:900;font-size:9px">${p.us?'US':''}</span>`;
    p._ov=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(p.lat,p.lng),content:el,yAnchor:1,zIndex:p.us?5:3});
  });
}

// ── 상세 시트 + 로드뷰 ──
const sheet=document.getElementById('sheet');
function openSheet(p){
  if(curLine){curLine.setMap(null);curLine=null;}
  // 회사→가게 라인 (카카오 도보 경로 API는 키·쿼터 이슈로 직선; 카카오맵 길찾기 버튼이 실경로 담당)
  curLine=new kakao.maps.Polyline({path:[new kakao.maps.LatLng(OFFICE.lat,OFFICE.lng),new kakao.maps.LatLng(p.lat,p.lng)],
    strokeWeight:3,strokeColor:p.gold?'#1E7BE0':p.us?'#0E8A4C':'#F25C1F',strokeOpacity:.8,strokeStyle:'dash'});
  curLine.setMap(map);
  map.setCenter(new kakao.maps.LatLng((OFFICE.lat+p.lat)/2,(OFFICE.lng+p.lng)/2));
  const min=p.walk;
  sheet.innerHTML=`<div class="grab"></div>
    <div class="s-head"><span class="s-name">${p.n}</span>
      ${p.us?'<span class="tag t-us">US인증</span>':''}<span class="tag t-cat">${p.cat}</span>
      ${p.wait===3?'<span class="tag t-w2">웨이팅 헬·원격필수</span>':p.wait===2?'<span class="tag t-w2">웨이팅 필수</span>':p.wait===1?'<span class="tag t-w1">붐빔 주의</span>':''}
      ${p.gold?'<span class="tag t-ct">🔵 예약가능</span>':''}</div>
    <div class="s-stats">${p.r?`<span class="star">★</span> <b>${p.r.toFixed(1)}</b> · 리뷰 ${p.c.toLocaleString()}`:''}${p.approx?' · <small>좌표 근사</small>':''}</div>
    <div id="rv"></div><div class="rv-none" id="rvnone">이 위치는 로드뷰(거리 실사진)가 없어. 카카오맵 버튼으로 확인해줘.</div>
    <div class="walkline">🚶 회사에서 직선 ${Math.round(p.dist)}m · 도보 약 ${min}분 — 아래 길찾기로 실제 경로 확인</div>
    <div class="ctline">${p.ct===1?'📱 캐치테이블 <b>입점 확인됨</b> — 원격 웨이팅 가능':p.ct===-1?'📱 캐치테이블 <b style="color:#C43A2E">미입점</b> — 현장만':'📱 캐치테이블 <b>미확인</b> — 아래 버튼으로 검색'}</div>
    ${p.wait?`<div class="planbox">⏰ <b>12시 식사 플랜</b> — ${lunchPlan(p)}</div>`:''}
    ${p.us?`<div class="usbox"><div class="who">🟢 US 동료 후기 (사내 대동여지도)</div><p>${p.usr}</p></div>`:''}
    ${p.memo?`<div class="gmemo">${p.memo}</div>`:''}
    <div class="s-links" id="slinks"></div>`;
  const L=sheet.querySelector('#slinks');
  const mk=(c,t,f)=>{const b=document.createElement('button');b.className=c;b.textContent=t;b.onclick=f;return b;};
  if(p.wait||p.ct===1){const lb=p.ct===1?'📱 캐치테이블 웨이팅':p.ct===-1?'캐치테이블(미입점)':'캐치테이블 검색';
    L.appendChild(mk('ctlink',lb,()=>window.open(p.ctUrl||p.ctSearch,'_blank','noopener')));}
  L.appendChild(mk('kakao','🚶 카카오맵 길찾기',()=>kakaoRoute(p)));
  L.appendChild(mk('nvr','네이버 지도',()=>naverPlace(p)));
  L.appendChild(mk('closebtn','닫기',closeSheet));
  sheet.classList.add('open');
  loadRoadview(p);
}
// 시트 내 인라인 로드뷰
function loadRoadview(p){
  const box=document.getElementById('rv'),none=document.getElementById('rvnone');
  const pos=new kakao.maps.LatLng(p.lat,p.lng);
  rvClient.getNearestPanoId(pos,80,function(panoId){
    if(panoId===null){ none.style.display='block'; box.style.display='none'; return; }
    box.style.display='block'; none.style.display='none';
    if(!rv){ rv=new kakao.maps.Roadview(box); }
    rv.setPanoId(panoId,pos);
  });
}
function closeSheet(){sheet.classList.remove('open');if(curLine){curLine.setMap(null);curLine=null;}}
function kakaoRoute(p){
  const sp=`${OFFICE.lat},${OFFICE.lng}`,ep=`${p.lat},${p.lng}`;
  if(IS_MOBILE)window.location.href=`kakaomap://route?sp=${sp}&ep=${ep}&by=FOOT`;
  else window.open(`https://map.kakao.com/link/to/${encodeURIComponent(p.n)},${p.lat},${p.lng}`,'_blank','noopener');
}
function naverPlace(p){window.open(`https://map.naver.com/p/search/${encodeURIComponent(p.n+' 합정')}`,'_blank','noopener');}

// ── 검색 ──
const qi=document.getElementById('q'),qc=document.getElementById('qclr');
qi.addEventListener('input',()=>{q=qi.value.trim().toLowerCase();qc.classList.toggle('on',!!q);closeSheet();applyFilter();
  const pts=P.filter(matchCat); if(q&&pts.length){const b=new kakao.maps.LatLngBounds();pts.forEach(p=>b.extend(new kakao.maps.LatLng(p.lat,p.lng)));map.setBounds(b);}});
qc.onclick=()=>{qi.value="";q="";qc.classList.remove('on');applyFilter();qi.focus();};
document.getElementById('fab').onclick=()=>{const pool=P.filter(matchCat);if(pool.length)openSheet(pool[Math.floor(Math.random()*pool.length)]);};

// SDK 로드 타임아웃 (5초 안에 kakao 없으면 에러)
setTimeout(()=>{if(!window.kakao||!kakao.maps||!map)initKakao();},300);
setTimeout(()=>{if(!map)bootError('<b>카카오 지도 로딩 실패(타임아웃).</b><br>도메인 등록·앱키를 확인해줘. GitHub Pages 주소로 열어야 동작해.');},5000);
</script>
<!-- 카카오맵 SDK: autoload=false + libraries=services 로 로드뷰/지오코더 사용 -->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_JS_KEY&autoload=false&libraries=services" onload="initKakao()" onerror="bootError('<b>SDK 스크립트를 불러오지 못했어.</b><br>도메인 등록 여부·네트워크를 확인해줘.')"></script>
</body>
