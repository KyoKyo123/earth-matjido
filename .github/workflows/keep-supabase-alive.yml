name: Keep Supabase Alive

# 3일마다 자동 실행 + 수동 실행 버튼도 제공(Actions 탭에서 "Run workflow"로 즉시 테스트 가능)
on:
  schedule:
    - cron: "0 3 */3 * *"  # 매 3일마다 오전 3시(UTC, 한국시간 정오)에 실행
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent 7-day inactivity pause
        run: |
          curl -s -o /dev/null -w "응답 코드: %{http_code}\n" \
            "https://evhiixhyqpsbwssxukxx.supabase.co/rest/v1/votes?select=id&limit=1" \
            -H "apikey: sb_publishable_ucfFkIfGUjcx9pOif0fOXQ_o4Argobe"
